{
  "openapi": "3.1.0",
  "info": {
    "title": "Roooooom Local Coordination API",
    "version": "0.1.0-dev",
    "description": "Authoritative JSON-compatible YAML contract. Source-owned constraints and evidence references never prove Git or tests were executed by this service."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:7337"
    }
  ],
  "paths": {
    "/api/v1/setup/activate": {
      "post": {
        "operationId": "activateOwner",
        "description": "One-time five-minute private file form. Only this route accepts Origin null.",
        "requestBody": {
          "required": true,
          "content": {
            "application/x-www-form-urlencoded": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "capability"
                ],
                "properties": {
                  "capability": {
                    "type": "string"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "303": {
            "description": "Owner HttpOnly SameSite Strict cookie; redirect to setup"
          },
          "409": {
            "description": "Expired or consumed capability"
          }
        }
      }
    },
    "/api/v1/me": {
      "get": {
        "operationId": "currentActor",
        "security": [
          {
            "AgentBearer": []
          },
          {
            "OwnerCookie": []
          }
        ],
        "responses": {
          "200": {
            "description": "Authenticated actor; CSRF, ownerLanguage and build information returned only to the same-origin owner cookie session",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/enroll": {
      "post": {
        "operationId": "enrollAgent",
        "security": [
          {
            "AgentBearer": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Enrollment"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Credentials in result; caller stores privately",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          },
          "default": {
            "description": "Structured error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/commands/{kind}": {
      "post": {
        "operationId": "applyCommand",
        "description": "Owner configuration requires owner cookie, exact Origin and X-CSRF-Token. Body actor fields are forbidden.",
        "security": [
          {
            "AgentBearer": []
          },
          {
            "OwnerCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "kind",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "project.create",
                "enrollment.enable",
                "participant.revoke",
                "task.create",
                "integrator.claim",
                "assignment.create",
                "assignment.claim",
                "assignment.release",
                "assignment.update",
                "collaborator.limit",
                "task.reopen",
                "task.cancel",
                "session.checkpoint",
                "session.end",
                "session.resume",
                "integrator.handoff",
                "message.send",
                "receipt.update",
                "decision.request",
                "decision.resolve",
                "decision.supersede",
                "decision.withdraw",
                "decision.followup",
                "delivery.submit",
                "delivery.review",
                "integration.record",
                "acceptance.policy",
                "acceptance.candidate",
                "acceptance.accept",
                "task.complete",
                "offline.reconcile",
                "offline.resolve",
                "backup.create",
                "backup.export",
                "participant.recover",
                "binding.create",
                "binding.disable",
                "binding.retry",
                "binding.credential",
                "binding.rotate",
                "request.create",
                "request.claim",
                "request.release",
                "request.handoff",
                "request.accept",
                "request.resume",
                "request.assign",
                "request.cancel",
                "request.convert",
                "binding.inspect",
                "owner.language"
              ]
            }
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Mutation"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Atomic committed receipt",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          },
          "default": {
            "description": "Structured error; 400 invalid, 401 unauthenticated, 403 forbidden, 409 stale, 413 body budget",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/health": {
      "get": {
        "operationId": "health",
        "responses": {
          "200": {
            "description": "Minimal service identity; no tasks or credentials",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Identity"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/queries/{kind}": {
      "get": {
        "operationId": "readWorkspace",
        "security": [
          {
            "AgentBearer": []
          },
          {
            "OwnerCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "kind",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "projects",
                "tasks",
                "task",
                "assignments",
                "assignment",
                "sessions",
                "attention",
                "inbox",
                "thread",
                "message",
                "decisions",
                "decision",
                "deliveries",
                "delivery",
                "integrations",
                "candidate",
                "acceptances",
                "completions",
                "offline-candidates",
                "offline-candidate",
                "metrics",
                "participants",
                "candidates",
                "bindings",
                "outbound-jobs",
                "requests",
                "request"
              ]
            }
          },
          {
            "in": "query",
            "name": "projectId",
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "targetId",
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "cursor",
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "limit",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 200
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Scoped read snapshot",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          },
          "default": {
            "description": "Structured error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/sessions": {
      "post": {
        "operationId": "createWorkSession",
        "description": "Creates a fresh session for the same participant and project; transfers no responsibilities.",
        "security": [
          {
            "AgentBearer": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "serviceId",
                  "datasetGeneration",
                  "clientRequestId"
                ],
                "properties": {
                  "serviceId": {
                    "type": "string",
                    "minLength": 1
                  },
                  "datasetGeneration": {
                    "type": "string",
                    "minLength": 1
                  },
                  "clientRequestId": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 128
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Credentials in result; store privately",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          },
          "default": {
            "description": "Structured error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/identity": {
      "get": {
        "operationId": "identity",
        "responses": {
          "200": {
            "description": "Identity to compare before transmitting client credentials",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Identity"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/sync": {
      "get": {
        "operationId": "syncWorkspace",
        "security": [
          {
            "AgentBearer": []
          },
          {
            "OwnerCookie": []
          }
        ],
        "parameters": [
          {
            "in": "query",
            "name": "cursor",
            "schema": {
              "type": "string",
              "maxLength": 4096
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Durable events; no automatic fetched/seen receipt",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          },
          "default": {
            "description": "Structured error including cursor_reset",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/wait": {
      "get": {
        "operationId": "waitWorkspace",
        "security": [
          {
            "AgentBearer": []
          },
          {
            "OwnerCookie": []
          }
        ],
        "parameters": [
          {
            "in": "query",
            "name": "cursor",
            "schema": {
              "type": "string",
              "maxLength": 4096
            }
          },
          {
            "in": "query",
            "name": "timeoutSeconds",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 60,
              "default": 30
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Durable events; no automatic fetched/seen receipt",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          },
          "default": {
            "description": "Structured error including cursor_reset",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/events": {
      "get": {
        "operationId": "eventsWorkspace",
        "security": [
          {
            "AgentBearer": []
          },
          {
            "OwnerCookie": []
          }
        ],
        "parameters": [
          {
            "in": "query",
            "name": "cursor",
            "schema": {
              "type": "string",
              "maxLength": 4096
            }
          },
          {
            "in": "header",
            "name": "Last-Event-ID",
            "schema": {
              "type": "string",
              "maxLength": 4096
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Durable events; no automatic fetched/seen receipt",
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string",
                  "description": "workspace events contain a SyncPage as JSON data; id is the signed cursor"
                }
              }
            }
          },
          "default": {
            "description": "Structured error including cursor_reset",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/control/probe": {
      "post": {
        "operationId": "ownServiceProbe",
        "description": "Private native launcher control plane. Raw bounded response, outside agent commands/events; exact identity and installation checks. No vendor-host control.",
        "security": [
          {
            "OwnerControl": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ControlIdentity"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Own product control result; no capability in the response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ControlProof"
                }
              }
            }
          },
          "403": {
            "description": "Agent/owner-cookie/foreign-origin requests cannot use this capability"
          },
          "409": {
            "description": "Service identity changed"
          }
        }
      }
    },
    "/api/v1/control/activate": {
      "post": {
        "operationId": "ownServiceActivate",
        "description": "Private native launcher control plane. Raw bounded response, outside agent commands/events; exact identity and installation checks. No vendor-host control.",
        "security": [
          {
            "OwnerControl": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ControlIdentity"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Own product control result; no capability in the response",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "activationPath": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "403": {
            "description": "Agent/owner-cookie/foreign-origin requests cannot use this capability"
          },
          "409": {
            "description": "Service identity changed"
          }
        }
      }
    },
    "/api/v1/control/stop": {
      "post": {
        "operationId": "ownServiceStop",
        "description": "Private native launcher control plane. Raw bounded response, outside agent commands/events; exact identity and installation checks. No vendor-host control.",
        "security": [
          {
            "OwnerControl": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ControlIdentity"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Own product control result; no capability in the response",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "stopping": {
                      "type": "boolean"
                    }
                  }
                }
              }
            }
          },
          "403": {
            "description": "Agent/owner-cookie/foreign-origin requests cannot use this capability"
          },
          "409": {
            "description": "Service identity changed"
          }
        }
      }
    },
    "/api/v1/setup/connection": {
      "get": {
        "operationId": "ownerConnectionInstructions",
        "description": "Owner-only product paths for generated connection instructions. Never returns capability/token.",
        "security": [
          {
            "OwnerCookie": []
          }
        ],
        "responses": {
          "200": {
            "description": "Owner connection metadata",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          },
          "403": {
            "description": "Agents forbidden"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "AgentBearer": {
        "type": "http",
        "scheme": "bearer"
      },
      "OwnerCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "roooooom_owner"
      },
      "OwnerControl": {
        "type": "http",
        "scheme": "bearer",
        "description": "Ephemeral own-service control capability from the product-private control.json. Never an agent token or browser owner cookie."
      }
    },
    "schemas": {
      "Mutation": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "serviceId",
          "datasetGeneration",
          "clientRequestId",
          "payload"
        ],
        "properties": {
          "serviceId": {
            "type": "string",
            "minLength": 1
          },
          "datasetGeneration": {
            "type": "string",
            "minLength": 1
          },
          "clientRequestId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "targetId": {
            "type": "string"
          },
          "expectedVersion": {
            "type": "integer",
            "format": "int64"
          },
          "claimEpoch": {
            "type": "integer",
            "format": "int64"
          },
          "integratorEpoch": {
            "type": "integer",
            "format": "int64"
          },
          "specVersion": {
            "type": "integer",
            "format": "int64"
          },
          "acceptancePolicyVersion": {
            "type": "integer",
            "format": "int64"
          },
          "sessionId": {
            "type": "string"
          },
          "decisionVersions": {
            "type": "object",
            "additionalProperties": {
              "type": "integer",
              "format": "int64"
            }
          },
          "payload": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/ProjectCreate"
              },
              {
                "$ref": "#/components/schemas/Empty"
              },
              {
                "$ref": "#/components/schemas/TaskCreate"
              },
              {
                "$ref": "#/components/schemas/AssignmentCreate"
              },
              {
                "$ref": "#/components/schemas/Release"
              },
              {
                "$ref": "#/components/schemas/AssignmentUpdate"
              },
              {
                "$ref": "#/components/schemas/Limit"
              },
              {
                "$ref": "#/components/schemas/Reason"
              },
              {
                "$ref": "#/components/schemas/Checkpoint"
              },
              {
                "$ref": "#/components/schemas/Resume"
              },
              {
                "$ref": "#/components/schemas/Handoff"
              },
              {
                "$ref": "#/components/schemas/MessageSend"
              },
              {
                "$ref": "#/components/schemas/ReceiptUpdate"
              },
              {
                "$ref": "#/components/schemas/DecisionRequest"
              },
              {
                "$ref": "#/components/schemas/DecisionResolve"
              },
              {
                "$ref": "#/components/schemas/DecisionFollowup"
              },
              {
                "$ref": "#/components/schemas/DeliverySubmit"
              },
              {
                "$ref": "#/components/schemas/DeliveryReview"
              },
              {
                "$ref": "#/components/schemas/IntegrationRecord"
              },
              {
                "$ref": "#/components/schemas/AcceptancePolicyChange"
              },
              {
                "$ref": "#/components/schemas/AcceptanceCandidate"
              },
              {
                "$ref": "#/components/schemas/AcceptCandidate"
              },
              {
                "$ref": "#/components/schemas/OfflineReconcile"
              },
              {
                "$ref": "#/components/schemas/OfflineReview"
              },
              {
                "$ref": "#/components/schemas/RequestCreate"
              },
              {
                "$ref": "#/components/schemas/RequestHandoff"
              },
              {
                "$ref": "#/components/schemas/RequestResume"
              },
              {
                "$ref": "#/components/schemas/RequestAssign"
              },
              {
                "$ref": "#/components/schemas/RequestConvert"
              },
              {
                "$ref": "#/components/schemas/BindingCredential"
              },
              {
                "$ref": "#/components/schemas/BindingInspectionInput"
              }
            ]
          }
        }
      },
      "Checkpoint": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "summary"
        ],
        "properties": {
          "summary": {
            "type": "string",
            "minLength": 1,
            "maxLength": 8192
          },
          "handoffTargetSessionId": {
            "type": "string"
          },
          "responsibilityIds": {
            "type": "array",
            "maxItems": 2000,
            "items": {
              "type": "string"
            }
          }
        }
      },
      "Resume": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "expectedSourceSessionId",
          "sourceVersion",
          "responsibilityIds"
        ],
        "properties": {
          "expectedSourceSessionId": {
            "type": "string"
          },
          "sourceVersion": {
            "type": "integer",
            "minimum": 1,
            "format": "int64"
          },
          "responsibilityIds": {
            "type": "array",
            "minItems": 1,
            "maxItems": 2000,
            "uniqueItems": true,
            "items": {
              "type": "string"
            }
          },
          "handoffCapabilityRef": {
            "type": "string",
            "description": "Private managed file reference",
            "never a raw capability": null
          },
          "force": {
            "type": "boolean",
            "description": "Owner only"
          },
          "reason": {
            "type": "string"
          }
        }
      },
      "Handoff": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "fromSessionId",
          "toSessionId",
          "dispositions",
          "reason"
        ],
        "properties": {
          "fromSessionId": {
            "type": "string"
          },
          "toSessionId": {
            "type": "string"
          },
          "handoffId": {
            "type": "string"
          },
          "acceptedHandoffVersion": {
            "type": "integer",
            "format": "int64"
          },
          "dispositions": {
            "type": "array",
            "maxItems": 2000,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "assignmentId",
                "action"
              ],
              "properties": {
                "assignmentId": {
                  "type": "string"
                },
                "action": {
                  "type": "string",
                  "enum": [
                    "transfer",
                    "release",
                    "continue-worker"
                  ]
                },
                "targetSessionId": {
                  "type": "string"
                }
              }
            }
          },
          "reason": {
            "type": "string",
            "minLength": 1,
            "maxLength": 8192
          },
          "force": {
            "type": "boolean",
            "description": "Owner only",
            "explicit handling of unknown source": null
          }
        }
      },
      "AcceptancePolicy": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "mode",
          "conditions",
          "ownerProtected"
        ],
        "properties": {
          "mode": {
            "type": "string",
            "enum": [
              "integrator",
              "designated-agent",
              "human"
            ]
          },
          "acceptorId": {
            "type": "string"
          },
          "conditions": {
            "type": "array",
            "minItems": 1,
            "maxItems": 200,
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 4096
            },
            "uniqueItems": true
          },
          "ownerProtected": {
            "type": "boolean"
          }
        }
      },
      "TaskCreate": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "projectId",
          "goal",
          "scope",
